name: EasyPath

options:
  bundleIdPrefix: com.easypath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Config.xcconfig is gitignored (contains the developer's own backend URL);
# copy Config.sample.xcconfig to get started. Same pattern as the Flutter
# app's dart_define.sample.json -> dart_define.json.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EasyPath:
    type: application
    platform: iOS
    sources:
      - path: EasyPath
        excludes:
          - "**/README.md"
    resources:
      - path: EasyPath/Resources/Assets.xcassets
      - path: EasyPath/Resources/Localizable.xcstrings
    info:
      path: EasyPath/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        BACKEND_BASE_URL: $(BACKEND_BASE_URL)
        # DEV-ONLY: BACKEND_BASE_URL (Config.xcconfig) points at plain
        # HTTP dev backends that move around (localhost, a LAN IP, or a
        # bare-IP cloud host like the current Vultr box) — none of them
        # have a TLS cert, and ATS blocks cleartext HTTP to anything but
        # localhost by default, which is exactly the "Could not search
        # for that destination" failure this was added to fix. Replace
        # this with a scoped NSExceptionDomains entry (or just put the
        # backend behind HTTPS) before any release/TestFlight build —
        # this disables ATS for the whole app, not just the backend host.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Declares which external apps we may probe with canOpenURL/open
        # (Core/Handoff/AppHandoffService.swift). Apple Maps needs no
        # entry — it's a system app reachable via `maps://` unconditionally.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - comgooglemaps-x-callback
          - moovit
        # Our own scheme, so Google Maps' x-callback-url flow
        # (comgooglemaps-x-callback://) can return control to us — see
        # Core/Handoff/HandoffCallback.swift and RootView's .onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: com.easypath.app
            CFBundleURLSchemes:
              - easypath
        NSLocationWhenInUseUsageDescription: >-
          EasyPath needs your location to plan routes, guide you while
          walking, and announce nearby places and functional points.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          EasyPath can use your location in the background to keep
          announcing directions and proximity alerts while navigating.
        NSMicrophoneUsageDescription: >-
          EasyPath needs the microphone to recognise your spoken commands,
          such as setting a destination or adding an exploration point.
        NSSpeechRecognitionUsageDescription: >-
          EasyPath uses speech recognition to convert your spoken commands
          into actions such as searching for a destination.
        NSBluetoothAlwaysUsageDescription: >-
          EasyPath uses Bluetooth to detect indoor navigation beacons and
          Auracast audio broadcasts near you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easypath.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Your own Apple ID's team, from Config.xcconfig (gitignored) —
        # keeps `xcodegen generate` from wiping the Team selection made
        # in Xcode's Signing & Capabilities tab every time the project is
        # regenerated. Leave DEVELOPMENT_TEAM unset in Config.xcconfig
        # and you'll still need to pick a Team manually in Xcode once.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    dependencies: []

  EasyPathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EasyPathTests
    dependencies:
      - target: EasyPath
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  EasyPathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EasyPathUITests
    dependencies:
      - target: EasyPath
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  EasyPath:
    build:
      targets:
        EasyPath: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EasyPathTests
        - EasyPathUITests
