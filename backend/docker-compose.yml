services:
  fastapi:
    build: ./fastapi
    container_name: ana-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi/app:/app
    environment:
      - MOTIS_URL=http://motis:8080
      - OVERPASS_URL=https://overpass-api.de/api/interpreter
    restart: unless-stopped
    # No depends_on: docker-compose doesn't block startup ordering on
    # this, but MOTIS is NOT optional in practice — there is no other
    # routing engine. If `motis` isn't running, /api/routes/plan returns
    # zero routes (no walk-only fallback exists since OSRM was removed).

  # Self-hosted routing engine — required for /api/routes/plan to return
  # anything. Needs an imported .osm.pbf + GTFS in ./motis/data/ (see
  # README there); already imported in this repo.
  motis:
    image: ghcr.io/motis-project/motis:latest
    container_name: ana-motis
    ports:
      - "8080:8080"
    volumes:
      - ./motis/data:/data
    restart: unless-stopped
