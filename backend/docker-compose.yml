

services:
  fastapi:
    build: ./fastapi
    container_name: ana-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi/app:/app
    environment:
      - MOTIS_URL=http://motis:8080
      - OVERPASS_URL=http://overpass:8080/api/interpreter
    restart: unless-stopped

