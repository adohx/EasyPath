services:
  fastapi:
    build: ./fastapi
    container_name: ana-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi/app:/app
    environment:
      - MOTIS_URL=http://motis:8080
      - OVERPASS_URL=https://overpass-api.de/api/interpreter
      - OSRM_URL=https://router.project-osrm.org
    restart: unless-stopped
    # No depends_on: MOTIS is optional. The backend falls back to OSRM if MOTIS
    # is unreachable. Start MOTIS separately once OSM data is ready.

  # Phase 2 optional: self-hosted routing engine.
  # Requires an .osm.pbf file in ./motis/data/input/ (see README there).
  # Start with: docker compose --profile routing up -d
  motis:
    profiles: ["routing"]
    image: ghcr.io/motis-project/motis:latest
    container_name: ana-motis
    ports:
      - "8080:8080"
    volumes:
      - ./motis/data:/data
    restart: unless-stopped
